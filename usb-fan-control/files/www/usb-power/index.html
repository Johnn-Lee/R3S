<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>NanoPi R3S · USB 供电</title>
  <style>

:root {
  color-scheme: light;
  --bg:#f5f5f7; --surface:#fff; --inset:#f5f5f7; --ink:#1d1d1f;
  --muted:#6e6e73; --line:rgba(0,0,0,.08); --track:#e9e9ed;
  --blue:#007aff; --green:#34c759; --rose:#ff3b30; --focus:rgba(0,122,255,.28);
  --shadow:0 2px 12px rgba(0,0,0,.025);
}
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; }
button,input { font:inherit; }
button { -webkit-tap-highlight-color:transparent; }
button:focus-visible,input:focus-visible { outline:3px solid var(--focus); outline-offset:4px; }
.shell { width:min(1080px,100%); margin:0 auto; padding:56px 28px 48px; }
header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:30px; }
.eyebrow { margin:0 0 8px; color:var(--muted); font-size:12px; font-weight:600; letter-spacing:1.7px; text-transform:uppercase; }
h1 { margin:0; font-size:34px; font-weight:700; letter-spacing:-1.2px; line-height:1.2; }
.subtitle { margin:10px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
.device-badge { display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--line); border-radius:20px; background:var(--surface); color:var(--muted); font-size:12px; white-space:nowrap; }
.device-badge svg { width:14px; height:14px; color:var(--blue); }
.card { min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); }

@media (max-width:760px) {
  .shell { padding:30px 18px 32px; }
  header { gap:18px; margin-bottom:24px; align-items:flex-start; }
  h1 { font-size:28px; letter-spacing:-.8px; }
  .subtitle { font-size:13px; }
  .card { border-radius:20px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; }
}

.shell { max-width:960px; }
.clock { display:flex; align-items:center; color:var(--muted); font-size:12px; line-height:1.5; font-variant-numeric:tabular-nums; }
.grid { display:grid; grid-template-columns:1fr 1.15fr; gap:20px; align-items:stretch; }
.card { padding:28px; }
.card-title { align-self:flex-start; margin:0; color:var(--muted); font-size:13px; font-weight:600; }
.status-card { display:flex; flex-direction:column; align-items:center; min-height:480px; text-align:center; }
.orb-wrap { display:grid; place-items:center; width:164px; height:164px; margin:42px 0 24px; background:var(--inset); border-radius:42px; transition:background .3s; }
.orb-wrap.on { background:rgba(52,199,89,.1); }
.power-icon { width:76px; height:76px; color:var(--muted); }
.on .power-icon { color:var(--green); animation:fan-spin 2.4s linear infinite; }
@keyframes fan-spin { to { transform:rotate(360deg); } }
.status { font-size:27px; font-weight:650; letter-spacing:-.7px; }
.status.on { color:var(--green); }
.status.off { color:var(--muted); }
.status-note { min-height:38px; margin:10px 0 28px; color:var(--muted); font-size:12px; line-height:1.6; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; margin-top:auto; }
.btn { min-height:44px; padding:10px 14px; border:0; border-radius:11px; cursor:pointer; font-size:14px; font-weight:600; transition:filter .15s,transform .15s,opacity .15s; }
.btn:hover { filter:brightness(.95); }
.btn:active { transform:scale(.98); }
.btn:disabled { cursor:wait; opacity:.5; transform:none; }
.btn-on,.save { color:#fff; background:var(--blue); }
.btn-off { color:var(--ink); background:var(--inset); }
.thermal-card { display:flex; flex-direction:column; }
.temp-display { display:flex; align-items:baseline; justify-content:center; margin:26px 0 18px; line-height:1; }
.temp-value { font-size:60px; font-weight:600; letter-spacing:-2.5px; color:var(--blue); font-variant-numeric:tabular-nums; }
.temp-unit { margin-left:5px; color:var(--muted); font-size:20px; }
.temp-track { height:5px; margin-bottom:12px; border-radius:4px; overflow:hidden; background:var(--track); }
.temp-track i { display:block; width:0; height:100%; border-radius:inherit; transition:width .8s,background .8s; background:var(--blue); }
.switch-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 0; border-bottom:1px solid var(--line); }
.switch-copy strong { display:block; font-size:15px; font-weight:600; }
.switch-copy span { display:block; margin-top:5px; color:var(--muted); font-size:11px; }
.switch { position:relative; width:51px; height:31px; flex:none; }
.switch input { position:absolute; opacity:0; width:100%; height:100%; margin:0; }
.slider { position:absolute; inset:0; background:var(--track); border-radius:20px; cursor:pointer; transition:background .2s; }
.slider::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.15); transition:transform .2s; }
.switch input:checked + .slider { background:var(--green); }
.switch input:checked + .slider::after { transform:translateX(20px); }
.switch input:focus-visible + .slider { outline:3px solid var(--focus); outline-offset:4px; }
.control-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0 12px; }
.field { display:block; min-width:0; padding:14px 16px; border-radius:12px; background:var(--inset); }
.field:focus-within { box-shadow:0 0 0 3px var(--focus); }
.field span { display:block; margin-bottom:8px; color:var(--muted); font-size:11px; }
input[type=number] { width:100%; min-height:32px; margin:0; padding:0; border:0; outline:0; color:var(--ink); background:transparent; font-size:24px; font-weight:500; font-variant-numeric:tabular-nums; }
.thermal-rule { min-height:34px; margin:0 0 18px; color:var(--muted); font-size:11px; line-height:1.6; text-align:center; }
.save { width:100%; }
.facts { display:grid; grid-template-columns:repeat(3,1fr); margin-top:24px; padding-top:20px; border-top:1px solid var(--line); }
.fact { min-width:0; text-align:center; padding:0 6px; }
.fact + .fact { border-left:1px solid var(--line); }
.fact b { display:block; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
.fact span { display:block; margin-top:5px; color:var(--muted); font-size:10px; }
.toast { position:fixed; z-index:5; left:50%; bottom:28px; transform:translate(-50%,12px); min-width:180px; max-width:calc(100% - 36px); padding:13px 20px; border:1px solid rgba(255,255,255,.1); border-radius:14px; color:#fff; background:rgba(29,29,31,.95); box-shadow:0 8px 30px rgba(0,0,0,.12); text-align:center; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; }
.toast.show { opacity:1; transform:translate(-50%,0); }
.toast.error { background:#c9342c; }
.offline { display:none; flex:none; width:7px; height:7px; margin-right:7px; border-radius:50%; background:var(--rose); }
@media (max-width:760px) {
  header { flex-direction:column; gap:14px; }
  .grid { grid-template-columns:1fr; gap:16px; }
  .card { padding:24px; }
  .status-card { min-height:390px; }
  .orb-wrap { width:140px; height:140px; border-radius:36px; margin:28px 0 20px; }
  .power-icon { width:66px; height:66px; }
}
</style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">NanoPi R3S</p><h1>USB 风扇温控</h1></div>
      <div class="clock"><i class="offline" id="offline"></i><span id="clock">正在连接设备…</span></div>
    </header>
    <section class="grid">
      <article class="card status-card">
        <h2 class="card-title">风扇供电状态</h2>
        <div class="orb-wrap" id="orb">
          <svg class="power-icon" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="9" fill="currentColor"/>
            <path d="M50 42C42 28 43 13 53 11c11-2 17 14 12 28-3 8-9 10-15 3ZM58 50c14-8 29-7 31 3 2 11-14 17-28 12-8-3-10-9-3-15ZM50 58c8 14 7 29-3 31-11 2-17-14-12-28 3-8 9-10 15-3ZM42 50c-14 8-29 7-31-3-2-11 14-17 28-12 8 3 10 9 3 15Z" fill="currentColor" opacity=".88"/>
          </svg>
        </div>
        <div class="status" id="status">读取中</div>
        <p class="status-note" id="statusNote">正在读取 GPIO0_A6</p>
        <div class="actions">
          <button class="btn btn-on control" data-state="1">开启供电</button>
          <button class="btn btn-off control" data-state="0">关闭供电</button>
        </div>
      </article>
      <article class="card thermal-card">
        <h2 class="card-title">CPU 实时温度</h2>
        <div class="temp-display"><span class="temp-value" id="tempValue">--.-</span><span class="temp-unit">°C</span></div>
        <div class="temp-track"><i id="tempBar"></i></div>
        <div class="switch-row">
          <div class="switch-copy"><strong>自动温控</strong><span>每 5 秒检查 CPU 温度</span></div>
          <label class="switch"><input id="enabled" type="checkbox" aria-label="自动温控"><span class="slider"></span></label>
        </div>
        <div class="control-grid">
          <label class="field"><span>启动温度 · °C</span><input id="temperature" type="number" value="45" min="20" max="90" step="1" inputmode="numeric" required></label>
          <label class="field"><span>降温强度 · °C</span><input id="hysteresis" type="number" value="3" min="1" max="20" step="1" inputmode="numeric" required></label>
        </div>
        <div class="thermal-rule" id="thermalRule">高于启动温度开启，降低指定温度后停止</div>
        <button class="btn save" id="save">保存温控设置</button>
        <div class="facts">
          <div class="fact"><b id="startValue">--°C</b><span>开启风扇</span></div>
          <div class="fact"><b id="stopValue">--°C</b><span>停止风扇</span></div>
          <div class="fact"><b>5 秒</b><span>检测间隔</span></div>
        </div>
      </article>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      "use strict";
      var busy=false, loaded=false, toastTimer;
      var statusEl=document.getElementById("status"), note=document.getElementById("statusNote");
      var orb=document.getElementById("orb"), clock=document.getElementById("clock"), offline=document.getElementById("offline");
      var enabled=document.getElementById("enabled"), temperature=document.getElementById("temperature"), hysteresis=document.getElementById("hysteresis");
      var tempValue=document.getElementById("tempValue"), tempBar=document.getElementById("tempBar");
      function showToast(text,error){var el=document.getElementById("toast");el.textContent=text;el.className="toast show"+(error?" error":"");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.className="toast";},2200);}
      function setBusy(value){busy=value;Array.prototype.forEach.call(document.querySelectorAll("button"),function(b){b.disabled=value;});}
      function updateRule(start,drop){var stop=start-drop;document.getElementById("startValue").textContent=start+"°C";document.getElementById("stopValue").textContent=stop+"°C";document.getElementById("thermalRule").textContent="CPU > "+start+"°C 开启风扇，降至 ≤ "+stop+"°C 停止";}
      function update(d){
        if(!d.ok){throw new Error(d.error||"设备返回错误");}
        var on=d.state==="1", temp=d.cpu_temp;
        statusEl.textContent=d.state==="unknown"?"状态未知":(on?"风扇运行中":"风扇已停止");
        statusEl.className="status "+(on?"on":"off");orb.className="orb-wrap "+(on?"on":"");
        note.textContent=d.enabled?("自动温控运行中 · "+(on?"正在降温":"等待升温")):("手动模式 · GPIO0_A6 "+(on?"高电平":"低电平"));
        clock.textContent=d.server_time+" 北京时间";offline.style.display="none";
        if(temp===null||typeof temp==="undefined"){tempValue.textContent="--.-";}else{tempValue.textContent=Number(temp).toFixed(1);var color=temp>d.temperature?"#ff3b30":(temp>d.stop_temperature?"#ff9500":"#007aff");tempValue.style.color=color;tempBar.style.background=color;tempBar.style.width=Math.max(0,Math.min(100,temp/85*100))+"%";}
        if(!loaded&&!busy){enabled.checked=!!d.enabled;temperature.value=d.temperature;hysteresis.value=d.hysteresis;loaded=true;}
        updateRule(d.temperature,d.hysteresis);
      }
      function request(body){var options={cache:"no-store"};if(body){options.method="POST";options.headers={"Content-Type":"application/x-www-form-urlencoded"};options.body=body;}return fetch("cgi-bin/api",options).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});}
      function poll(){if(busy)return;request().then(update).catch(function(){offline.style.display="inline-block";clock.textContent="连接暂时中断";});}
      Array.prototype.forEach.call(document.querySelectorAll(".control"),function(button){button.addEventListener("click",function(){var target=button.getAttribute("data-state");setBusy(true);request("action=control&state="+target).then(function(d){update(d);showToast(target==="1"?"风扇供电已开启":"风扇供电已关闭");}).catch(function(e){showToast(e.message,true);}).then(function(){setBusy(false);});});});
      document.getElementById("save").addEventListener("click",function(){
        var start=parseInt(temperature.value,10),drop=parseInt(hysteresis.value,10);
        if(!isFinite(start)||start<20||start>90){showToast("启动温度范围为 20–90°C",true);return;}
        if(!isFinite(drop)||drop<1||drop>20||drop>=start){showToast("降温强度应为 1–20°C 且低于启动温度",true);return;}
        setBusy(true);var body="action=thermal&enabled="+(enabled.checked?"1":"0")+"&temperature="+start+"&hysteresis="+drop;
        request(body).then(function(d){loaded=false;update(d);showToast("温控设置已保存");}).catch(function(e){showToast(e.message,true);}).then(function(){setBusy(false);});
      });
      temperature.addEventListener("input",function(){var a=parseInt(temperature.value,10),b=parseInt(hysteresis.value,10);if(isFinite(a)&&isFinite(b))updateRule(a,b);});
      hysteresis.addEventListener("input",function(){var a=parseInt(temperature.value,10),b=parseInt(hysteresis.value,10);if(isFinite(a)&&isFinite(b))updateRule(a,b);});
      poll();setInterval(poll,2000);
    }());
  </script>
</body>
</html>
