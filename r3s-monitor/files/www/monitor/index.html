<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R3S 监控</title>
<style>

:root {
  color-scheme: light;
  --bg:#f5f5f7; --surface:#fff; --inset:#f5f5f7; --ink:#1d1d1f;
  --muted:#6e6e73; --line:rgba(0,0,0,.08); --track:#e9e9ed;
  --blue:#007aff; --green:#34c759; --rose:#ff3b30; --focus:rgba(0,122,255,.28);
  --shadow:0 2px 12px rgba(0,0,0,.025);
}
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; }
button,input { font:inherit; }
button { -webkit-tap-highlight-color:transparent; }
button:focus-visible,input:focus-visible { outline:3px solid var(--focus); outline-offset:4px; }
.shell { width:min(1080px,100%); margin:0 auto; padding:56px 28px 48px; }
header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:30px; }
.eyebrow { margin:0 0 8px; color:var(--muted); font-size:12px; font-weight:600; letter-spacing:1.7px; text-transform:uppercase; }
h1 { margin:0; font-size:34px; font-weight:700; letter-spacing:-1.2px; line-height:1.2; }
.subtitle { margin:10px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
.device-badge { display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--line); border-radius:20px; background:var(--surface); color:var(--muted); font-size:12px; white-space:nowrap; }
.device-badge svg { width:14px; height:14px; color:var(--blue); }
.card { min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); }

@media (max-width:760px) {
  .shell { padding:30px 18px 32px; }
  header { gap:18px; margin-bottom:24px; align-items:flex-start; }
  h1 { font-size:28px; letter-spacing:-.8px; }
  .subtitle { font-size:13px; }
  .card { border-radius:20px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; }
}

svg { display:block; }
.row { display:grid; grid-template-columns:1fr 1.6fr 1fr; gap:18px; }
.card { padding:22px; display:flex; flex-direction:column; align-items:center; }
.card.small { min-height:224px; }
.card:nth-child(1) { grid-column:1; grid-row:1; }
.card:nth-child(2) { grid-column:3; grid-row:1; }
.card.big { grid-column:2; grid-row:1 / span 2; justify-content:center; padding:28px; }
.card:nth-child(4) { grid-column:1; grid-row:2; }
.card:nth-child(5) { grid-column:3; grid-row:2; }
.label { order:-1; align-self:flex-start; margin:0 0 20px; color:var(--muted); font-size:13px; font-weight:600; }
.ringwrap { position:relative; width:128px; height:128px; margin:auto; }
.ringwrap svg { width:100%; height:100%; transform:rotate(-90deg); }
.ringwrap circle:first-child { stroke:var(--track); stroke-width:9px; }
.ringwrap circle[id] { stroke-width:9px; }
.ringval { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.ringval .v { color:var(--ink); font-size:31px; font-weight:650; letter-spacing:-1px; font-variant-numeric:tabular-nums; }
.ringval .u { margin-top:2px; color:var(--muted); font-size:12px; }
#gauge-svg { width:100%; max-width:350px; height:auto; overflow:visible; }
#gauge-svg > path:not([id]) { stroke:var(--track); stroke-width:13px; }
#gauge-arc { stroke-width:13px; }
#ticks,#ticks line { stroke:var(--muted); stroke-width:1.5px; opacity:.7; }
#needle line,#needle circle:first-of-type { stroke:var(--ink); fill:var(--ink); }
#needle circle:last-child { fill:var(--surface); }
.gaugeval { display:flex; flex-direction:column; align-items:center; margin-top:14px; }
.gaugeval .v { font-size:68px; line-height:1.1; font-weight:650; letter-spacing:-3px; font-variant-numeric:tabular-nums; }
.gaugeval .pct { margin-left:4px; color:var(--muted); font-size:.38em; font-weight:500; letter-spacing:-.5px; }
.gaugeval .u { margin-top:10px; color:var(--muted); font-size:14px; }
@media (max-width:760px) {
  header { flex-direction:column; }
  .row { grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .card:nth-child(n) { grid-column:auto; grid-row:auto; }
  .card.big { order:-1; grid-column:1 / -1; min-height:320px; padding:24px 30px; }
  #gauge-svg { max-width:300px; }
  .card.small { min-height:204px; padding:18px 14px; }
  .label { margin-bottom:18px; font-size:12px; }
  .ringwrap { width:112px; height:112px; max-width:100%; aspect-ratio:1; }
  .ringval .v { font-size:28px; }
  .gaugeval .v { font-size:58px; }
}
</style>
</head>
<body>
<main class="shell">
<header><div><p class="eyebrow">NanoPi R3S</p><h1>系统监控</h1><p class="subtitle">设备资源与网络流量</p></div>
<div class="device-badge"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 11h3l2-6 5 11 2-6h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>每 2 秒更新</div></header>
<div class="row">

  <!-- 内存使用 -->
  <div class="card small">
    <div class="ringwrap">
      <svg width="168" height="168" viewBox="0 0 168 168">
        <circle cx="84" cy="84" r="74" fill="none" stroke="rgba(110,138,168,0.22)" stroke-width="14"/>
        <circle id="ring-mem" cx="84" cy="84" r="74" fill="none" stroke="#34c759"
                stroke-width="14" stroke-linecap="round" pathLength="100"
                stroke-dasharray="0 100" style="transition: stroke-dasharray .8s ease, stroke .8s ease"/>
      </svg>
      <div class="ringval"><div class="v" id="val-mem">--</div><div class="u">%</div></div>
    </div>
    <div class="label">内存使用</div>
  </div>

  <!-- CPU 温度 -->
  <div class="card small">
    <div class="ringwrap">
      <svg width="168" height="168" viewBox="0 0 168 168">
        <circle cx="84" cy="84" r="74" fill="none" stroke="rgba(110,138,168,0.22)" stroke-width="14"/>
        <circle id="ring-temp" cx="84" cy="84" r="74" fill="none" stroke="#007aff"
                stroke-width="14" stroke-linecap="round" pathLength="100"
                stroke-dasharray="0 100" style="transition: stroke-dasharray .8s ease, stroke .8s ease"/>
      </svg>
      <div class="ringval"><div class="v" id="val-temp">--</div><div class="u">°C</div></div>
    </div>
    <div class="label">CPU 温度</div>
  </div>

  <!-- CPU 大表盘 -->
  <div class="card big">
    <svg id="gauge-svg" width="320" height="200" viewBox="0 0 320 200">
      <!-- 刻度 -->
      <g id="ticks" stroke="rgba(110,138,168,0.45)" stroke-width="2.5" stroke-linecap="round"></g>
      <!-- 背景弧 -->
      <path d="M 37 180 A 123 123 0 0 1 283 180" fill="none" stroke="rgba(110,138,168,0.22)" stroke-width="20" stroke-linecap="round"/>
      <!-- 进度弧 -->
      <path id="gauge-arc" d="M 37 180 A 123 123 0 0 1 283 180" fill="none" stroke="#34c759"
            stroke-width="20" stroke-linecap="round" pathLength="100"
            stroke-dasharray="0 100" style="transition: stroke-dasharray .8s ease, stroke .8s ease"/>
      <!-- 指针 -->
      <g id="needle" style="transition: transform .8s cubic-bezier(.4,1.6,.5,1)">
        <line x1="160" y1="180" x2="160" y2="78" stroke="#52627a" stroke-width="4" stroke-linecap="round"/>
        <circle cx="160" cy="180" r="9" fill="#52627a"/>
        <circle cx="160" cy="180" r="4" fill="#f2f6fa"/>
      </g>
    </svg>
    <div class="gaugeval"><div class="v" id="val-cpu">--</div><div class="u">CPU 占用率</div></div>
  </div>

  <!-- 下行 -->
  <div class="card small">
    <div class="ringwrap">
      <svg width="168" height="168" viewBox="0 0 168 168">
        <circle cx="84" cy="84" r="74" fill="none" stroke="rgba(110,138,168,0.22)" stroke-width="14"/>
        <circle id="ring-rx" cx="84" cy="84" r="74" fill="none" stroke="#007aff"
                stroke-width="14" stroke-linecap="round" pathLength="100"
                stroke-dasharray="0 100" style="transition: stroke-dasharray .8s ease, stroke .8s ease"/>
      </svg>
      <div class="ringval"><div class="v" id="val-rx">--</div><div class="u">Mbps</div></div>
    </div>
    <div class="label">下行</div>
  </div>

  <!-- 上行 -->
  <div class="card small">
    <div class="ringwrap">
      <svg width="168" height="168" viewBox="0 0 168 168">
        <circle cx="84" cy="84" r="74" fill="none" stroke="rgba(110,138,168,0.22)" stroke-width="14"/>
        <circle id="ring-tx" cx="84" cy="84" r="74" fill="none" stroke="#5856d6"
                stroke-width="14" stroke-linecap="round" pathLength="100"
                stroke-dasharray="0 100" style="transition: stroke-dasharray .8s ease, stroke .8s ease"/>
      </svg>
      <div class="ringval"><div class="v" id="val-tx">--</div><div class="u">Mbps</div></div>
    </div>
    <div class="label">上行</div>
  </div>

</div>
</main>
<script>
(function () {
  // 生成表盘刻度（每 10% 一格）
  var ticks = document.getElementById('ticks');
  var CX = 160, CY = 180, R = 123;
  for (var i = 0; i <= 10; i++) {
    var a = Math.PI * (1 - i / 10);           // 180° -> 0°
    var long = (i % 5 === 0);
    var r1 = R + (long ? 16 : 11), r2 = R + 21;
    var x1 = CX + Math.cos(a) * r1, y1 = CY - Math.sin(a) * r1;
    var x2 = CX + Math.cos(a) * r2, y2 = CY - Math.sin(a) * r2;
    var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
    ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
    if (long) { ln.setAttribute('stroke', 'rgba(110,138,168,0.7)'); ln.setAttribute('stroke-width', '3'); }
    ticks.appendChild(ln);
  }

  var $ = function (id) { return document.getElementById(id); };

  function setRing(id, pct) {
    pct = Math.max(0, Math.min(100, pct));
    $(id).setAttribute('stroke-dasharray', pct.toFixed(1) + ' 100');
  }
  function setStroke(id, color) { $(id).setAttribute('stroke', color); }

  // 状态颜色：正常 / 警告 / 高负载
  function colorFor(pct, warn, crit) {
    return pct < warn ? '#34c759' : (pct < crit ? '#ff9500' : '#ff3b30');
  }
  function tempColor(t) { return t < 60 ? '#007aff' : (t < 75 ? '#ff9500' : '#ff3b30'); }

  // 字节/秒 -> Mbps 显示
  function fmtMbps(bps) {
    var m = bps * 8 / 1000000;
    if (m < 10) return m.toFixed(2);
    if (m < 100) return m.toFixed(1);
    return m.toFixed(0);
  }

  function update(d) {
    // 内存
    var mem = d.mem;
    $('val-mem').textContent = mem.toFixed(0);
    setRing('ring-mem', mem);
    setStroke('ring-mem', colorFor(mem, 60, 85));

    // 温度（环形按 0-100°C 映射）
    var t = d.temp;
    $('val-temp').textContent = t.toFixed(1);
    setRing('ring-temp', t);
    setStroke('ring-temp', tempColor(t));

    // CPU 大表盘：精度跟随系统输出（整数显整数，否则保留两位小数）
    var cpu = d.cpu;
    var cpuStr = (Math.round(cpu * 100) / 100) % 1 === 0
      ? cpu.toFixed(0) : cpu.toFixed(2);
    $('val-cpu').innerHTML = cpuStr + '<span class="pct">%</span>';
    setRing('gauge-arc', cpu);
    setStroke('gauge-arc', colorFor(cpu, 60, 85));
    $('needle').style.transform = 'rotate(' + (-90 + cpu * 1.8) + 'deg)';
    $('needle').style.transformOrigin = '160px 180px';

    // 网速（环形按 1000 Mbps 满刻度）
    $('val-rx').textContent = fmtMbps(d.rx);
    $('val-tx').textContent = fmtMbps(d.tx);
    setRing('ring-rx', d.rx * 8 / 10000000);
    setRing('ring-tx', d.tx * 8 / 10000000);
  }

  function poll() {
    fetch('data.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(update)
      .catch(function () {});
  }
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
